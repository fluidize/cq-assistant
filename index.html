<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documents Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="documents">
      <div class="documents-panel">
        <h2>Documents</h2>
        <label class="upload-btn">
          Upload
          <input type="file" id="file-input" multiple hidden />
        </label>
      </div>
      <ul id="document-list" class="document-list"></ul>
    </aside>

    <main class="chat">
      <div class="chat-area">
        <div id="chat-scroll" class="chat-scroll">
          <p class="empty">Start the conversation</p>
        </div>
        <div class="chat-footer">
          <span id="ctx-usage">0 / — tokens</span>
        </div>
      </div>

      <form id="prompt-form" class="prompt-area">
        <div class="prompt-box">
          <textarea
            id="prompt-input"
            class="prompt-input"
            rows="1"
            placeholder="Press enter to send..."
          ></textarea>
        </div>
        <button type="button" id="key-btn" class="reset-btn">API key</button>
        <button type="button" id="reset-btn" class="reset-btn">New chat</button>
      </form>
    </main>

    <aside class="findings">
      <div class="findings-panel">
        <h2>Findings</h2>
        <div class="findings-filter">
          <button type="button" class="finding-filter active" data-type="APPROVED">
            Approved
          </button>
          <span class="filter-sep">|</span>
          <button type="button" class="finding-filter active" data-type="ERROR">
            Error
          </button>
          <span class="filter-sep">|</span>
          <button type="button" class="finding-filter active" data-type="INFO">
            Info
          </button>
        </div>
      </div>
      <ul id="findings-list" class="findings-list"></ul>
    </aside>
  </div>

  <dialog id="finding-modal" class="finding-modal">
    <div class="finding-modal-body">
      <div class="finding-head">
        <span id="finding-modal-name" class="finding-name"></span>
        <span id="finding-modal-type" class="finding-type"></span>
      </div>
      <p id="finding-modal-notes" class="finding-modal-notes"></p>
    </div>
  </dialog>

  <dialog id="key-modal" class="key-modal">
    <form id="key-form" class="key-modal-body">
      <h2>API key</h2>
      <p class="key-modal-hint">
        Enter your API key.
      </p>
      <div class="key-input-row">
        <input
          id="key-input"
          class="key-input"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="sk-..."
        />
        <button type="submit" class="key-save">Save key</button>
      </div>
      <p id="key-error" class="key-error"></p>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
